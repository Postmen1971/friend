*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Roboto,sans-serif;font-size:18px}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 36px 4px}
h1{margin:0;font-size:26px;font-weight:600}
.ver{color:var(--mut);font-size:14px;font-weight:400;margin-left:10px}
.hint{color:var(--mut);font-size:14px;padding:0 36px}
.bar{display:flex;gap:16px}
button,input{font:inherit;color:var(--txt)}
.btn{background:var(--card2);border:3px solid transparent;border-radius:14px;padding:12px 22px;cursor:pointer}
main{padding:4px 36px 48px}
h2{font-size:19px;color:var(--mut);font-weight:500;margin:22px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.tile{background:var(--card);border:3px solid transparent;border-radius:16px;height:100px;padding:14px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;position:relative}
.tile .n{font-size:20px;font-weight:600}
.tile .del{position:absolute;top:10px;right:14px;color:var(--acc);font-size:20px;display:none}
body.edit .tile .del{display:block}
.add{border-style:dashed;border-color:#3a3e4a;align-items:center;justify-content:center;color:var(--mut)}
:focus{outline:none}
.btn:focus,.tile:focus,input:focus{border-color:var(--focus);transform:scale(1.04);box-shadow:0 0 0 6px rgba(255,255,255,.12)}
.tile,.btn{transition:transform .12s}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9}
.overlay.on{display:flex}
.box{background:var(--card);border-radius:20px;padding:26px;width:min(560px,92vw);max-height:96vh;overflow:auto}
.box h3{margin:0 0 14px;font-size:22px}
.box label{display:block;color:var(--mut);margin:14px 0 6px;font-size:18px}
.box input{width:100%;background:var(--card2);border:3px solid transparent;border-radius:12px;padding:14px}
.row{display:flex;gap:14px;margin-top:24px;justify-content:flex-end}
.msg{color:var(--acc);min-height:28px;margin-top:10px;font-size:18px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.pinpad .btn{padding:10px;font-size:22px}
.dots{font-size:30px;letter-spacing:12px;text-align:center;min-height:40px}
.empty{color:var(--mut);margin-top:40px}
</style>
</head>

const hash=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)};

function render(){
  const m=document.getElementById('main');m.innerHTML='';
  const groups={};
  const all=tiles.map((t,i)=>Object.assign({},t,{i:i}));
  /* Zuletzt geöffnet (max. 4) ganz oben */
  const recent=all.filter(t=>t.last).sort((a,b)=>b.last-a.last).slice(0,4);
  if(recent.length&&!document.body.classList.contains('edit'))groups['Zuletzt geöffnet']=recent;
  /* Innerhalb jeder Gruppe: am häufigsten geöffnet zuerst */
  all.slice().sort((a,b)=>(b.count||0)-(a.count||0)).forEach(t=>{const g=t.group||'Allgemein';(groups[g]=groups[g]||[]).push(t)});
  const names=Object.keys(groups);
  if(!names.length){m.innerHTML='<p class="empty">Noch keine Kacheln. Mit „Bearbeiten“ → „+“ hinzufügen.</p>'}
  names.forEach(g=>{
    const h=document.createElement('h2');h.textContent=g;m.appendChild(h);
    const grid=document.createElement('div');grid.className='grid';
    groups[g].forEach(t=>{
      const b=document.createElement('button');b.className='tile';
      b.innerHTML='<span class="del">✕ löschen</span><span class="n"></span>';
      b.querySelector('.n').textContent=t.name;
      b.onclick=()=>{
        if(document.body.classList.contains('edit')){
          if(confirm('„'+t.name+'“ löschen?')){tiles.splice(t.i,1);save();render();focusFirst()}
        } else {
          const o=tiles[t.i];o.count=(o.count||0)+1;o.last=Date.now();save();
          location.href=t.url;
        }
      };
      grid.appendChild(b);
    });
    m.appendChild(grid);
  });
  if(document.body.classList.contains('edit')){
    const grid=document.createElement('div');grid.className='grid';grid.style.marginTop='28px';
    const a=document.createElement('button');a.className='tile add';a.innerHTML='<span class="n">+ Kachel</span>';
    a.onclick=openAdd;grid.appendChild(a);m.appendChild(grid);
  }
}

  const msg=document.getElementById('pinMsg');
  if(mode==='set'){
    if(!first){first=entry;entry='';drawDots();document.getElementById('pinTitle').textContent='PIN wiederholen';return}
    if(first===entry){store.set(PKEY,hash(entry));unlock()}
    else{msg.textContent='Stimmt nicht überein. Nochmal.';first='';entry='';drawDots();document.getElementById('pinTitle').textContent='Neue PIN festlegen (4 Ziffern)'}
  } else {
    if(hash(entry)===store.get(PKEY))unlock();
    else{msg.textContent='Falsche PIN.';entry='';drawDots()}
  }
}

/* Steuerkreuz-Navigation */
function focusables(){
  const ov=document.querySelector('.overlay.on');
  const root=ov||document;
  return [...root.querySelectorAll('button,input')].filter(e=>e.offsetParent!==null);
}
function focusFirst(){const f=focusables();const t=f.find(e=>e.classList.contains('tile'))||f[0];t&&t.focus()}
document.addEventListener('keydown',e=>{
  const dirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
  const d=dirs[e.key];if(!d)return;
  const cur=document.activeElement;
  if(cur&&cur.tagName==='INPUT'&&d[0]!==0)return; // links/rechts im Textfeld erlauben
  const list=focusables();if(!list.length)return;
  if(!list.includes(cur)){list[0].focus();e.preventDefault();return}
  const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let best=null,bd=Infinity;
  list.forEach(el=>{
    if(el===cur)return;
    const q=el.getBoundingClientRect(),x=q.left+q.width/2,y=q.top+q.height/2;
    const dx=x-cx,dy=y-cy;
    if(d[0]&&Math.sign(dx)!==d[0]||d[0]&&Math.abs(dx)<2)return;
    if(d[1]&&Math.sign(dy)!==d[1]||d[1]&&Math.abs(dy)<2)return;
    const main=d[0]?Math.abs(dx):Math.abs(dy),side=d[0]?Math.abs(dy):Math.abs(dx);
    const score=main+side*2.5;
    if(score<bd){bd=score;best=el}
  });
  if(best){best.focus();best.scrollIntoView({block:'nearest',behavior:'smooth'});e.preventDefault()}
});

/* Verbindungen zu den Kachel-Seiten vorab aufbauen (DNS + TLS), damit der erste Klick schneller ist */
function preconnect(){
  const done={};
  tiles.slice().sort((a,b)=>(b.count||0)-(a.count||0)).slice(0,12).forEach(t=>{
    let o;try{o=new URL(t.url).origin}catch(e){return}
    if(done[o])return;done[o]=1;
    ['dns-prefetch','preconnect'].forEach(r=>{const l=document.createElement('link');l.rel=r;l.href=o;l.crossOrigin='anonymous';document.head.appendChild(l)});
  });
}
